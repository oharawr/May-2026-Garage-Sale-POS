<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Crimson+Pro:wght@300;400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#dfeaf7;
  --panel:#f7fbff;
  --panel2:#edf4fb;
  --border:#c7d8ea;
  --text:#516579;
  --muted:#8ea4ba;
  --accent:#84a9d8;
  --accent-dark:#6e92c2;
  --green:#8fb6a2;
  --shadow:0 8px 24px rgba(86,110,136,.12);
}

body{
  background:linear-gradient(to bottom,#dfeaf7,#edf4fb);
  min-height:100vh;
  font-family:'Crimson Pro',serif;
  color:var(--text);
  padding:24px;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:radial-gradient(rgba(132,169,216,.15) 1px,transparent 1px);
  background-size:24px 24px;
  pointer-events:none;
}

.app{
  max-width:1200px;
  margin:auto;
}

header{
  background:rgba(247,251,255,.85);
  border:1px solid var(--border);
  border-radius:22px;
  padding:24px 28px;
  margin-bottom:20px;
  backdrop-filter:blur(8px);
  box-shadow:var(--shadow);
}

header h1{
  font-family:'Playfair Display',serif;
  font-size:2rem;
  color:var(--accent-dark);
}

header p{
  margin-top:6px;
  color:var(--muted);
  font-size:.95rem;
  letter-spacing:.04em;
}

.layout{
  display:grid;
  grid-template-columns:1fr 360px;
  gap:20px;
}

.panel{
  background:rgba(247,251,255,.82);
  border:1px solid var(--border);
  border-radius:22px;
  box-shadow:var(--shadow);
  overflow:hidden;
  backdrop-filter:blur(8px);
}

.sec-head{
  padding:18px 22px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(255,255,255,.5);
}

.sec-head h2{
  font-family:'Playfair Display',serif;
  color:var(--accent-dark);
  font-size:1.2rem;
}

.form{
  padding:22px;
  display:grid;
  grid-template-columns:1.4fr .8fr .6fr auto;
  gap:12px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label{
  font-size:.72rem;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--muted);
  font-family:'DM Mono',monospace;
}

.field input{
  border:1px solid var(--border);
  background:white;
  border-radius:12px;
  padding:12px;
  font-size:1rem;
  color:var(--text);
  outline:none;
}

.field input:focus{
  border-color:var(--accent);
}

button{
  border:none;
  cursor:pointer;
  border-radius:14px;
  transition:.18s;
}

.btn-add{
  align-self:end;
  padding:12px 18px;
  background:var(--accent);
  color:white;
  font-family:'Playfair Display',serif;
  font-size:1rem;
}

.btn-add:hover{
  background:var(--accent-dark);
}

.sale-list{
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:10px;
  min-height:300px;
}

.sale-row{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.sale-info h3{
  font-family:'Playfair Display',serif;
  font-size:1rem;
}

.sale-info p{
  color:var(--muted);
  margin-top:4px;
  font-size:.85rem;
}

.price{
  font-family:'DM Mono', monospace;
  color:var(--accent-dark);
}

.summary{
  padding:22px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.card{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
}

.card small{
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-size:.65rem;
  font-family:'DM Mono',monospace;
}

.card h3{
  margin-top:8px;
  font-size:1rem;
  color:var(--accent-dark);
  font-weight: 600;
  font-family:'DM Mono', monospace;
}

.checkout{
  width:100%;
  padding:14px;
  background:var(--green);
  color:white;
  font-size:1rem;
  font-family:'Playfair Display',serif;
}

.checkout:hover{
  filter:brightness(.95);
}

.history{
  margin-top:20px;
}

.history-list{
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.history-item{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
}

.history-top{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}

.history-total{
  font-family:'DM Mono',monospace;
  color:var(--accent-dark);
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:40px 20px;
}

/* ── ADDED: Clear History button ── */
.btn-clear{
  padding:7px 14px;
  background:transparent;
  border:1px solid var(--accent);
  color:var(--accent-dark);
  font-family:'DM Mono',monospace;
  font-size:.72rem;
  letter-spacing:.08em;
  border-radius:10px;
  cursor:pointer;
  transition:.18s;
}

.btn-clear:hover{
  background:#eef4fb;
  border-color:var(--accent-dark);
}

@media(max-width:900px){
  .layout{
    grid-template-columns:1fr;
  }

  .form{
    grid-template-columns:1fr;
  }
}

/* ── ADDED: Qty stepper ── */
.qty-stepper{
  display:flex;
  align-items:center;
  gap:8px;
  background:white;
  border:1px solid var(--border);
  border-radius:12px;
  padding:8px 12px;
  justify-content:space-between;
}

.qty-stepper span{
  font-family:'DM Mono',monospace;
  font-size:.9rem;
  color:var(--text);
  min-width:20px;
  text-align:center;
}

.qty-btn{
  width:26px;
  height:26px;
  border-radius:8px;
  background:var(--panel2);
  border:1px solid var(--border);
  color:var(--accent-dark);
  font-size:1rem;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.15s;
}

.qty-btn:hover{
  background:var(--accent);
  color:white;
  border-color:var(--accent);
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1>Sales Tracker ⋆˚࿔</h1>
  <p>small sales recorder! 𑣲</p>
</header>

<div class="layout">

  <div class="panel">

    <div class="sec-head">
      <h2>Current Sale .☘︎ ́˖</h2>
      <span id="itemCount">0 items</span>
    </div>

    <div class="form">

      <div class="field">
        <label>Item Name</label>
        <input type="text" id="itemName" style="font-family: 'DM Mono', monospace; font-style:italic; font-size: 0.80rem;" color:#A4A4A4; placeholder="e.g. Vintage Lamp">
      </div>

      <div class="field">
        <label>Price</label>
        <input type="number" id="itemPrice" style="font-family: 'DM Mono', monospace; font-style:italic; font-size: 0.80rem;" color:#A4A4A4; placeholder="0.00">
      </div>

      <div class="field">
        <label>Qty</label>
        <div class="qty-stepper">
          <button class="qty-btn" onclick="changeQty(-1)">&#8722;</button>
          <span id="itemQty">1</span>
          <button class="qty-btn" onclick="changeQty(1)">+</button>
        </div>
      </div>

      <button class="btn-add" onclick="addItem()">Add</button>

    </div>

    <div class="sale-list" id="saleList">

      <div class="empty">
        Add items for this transaction
      </div>

    </div>

  </div>

  <div class="panel">

    <div class="sec-head">
      <h2>Overall Summary .⋆</h2>
    </div>

    <div class="summary">

      <div class="card">
        <small>Total Revenue</small>
        <h3 id="revenue">₱0.00</h3>
      </div>

      <div class="card">
        <small>Transactions</small>
        <h3 id="transactions">0</h3>
      </div>

      <div class="card">
        <small>Items Sold</small>
        <h3 id="itemsSold">0</h3>
      </div>

      <button class="checkout" onclick="checkout()">
        Check Out!
      </button>

    </div>

  </div>

</div>

<div class="panel history">

  <div class="sec-head">
    <h2>Sales History ༉‧₊˚.</h2>
    <button class="btn-clear" onclick="clearHistory()">Clear History․ᐟ</button>
  </div>

  <div class="history-list" id="historyList">

    <div class="empty">
      Your completed sales will appear here!
    </div>

  </div>

</div>

</div>

<script>

let currentSale = [];
let history = JSON.parse(localStorage.getItem('blue_ledger_history') || '[]');

function peso(n){
  return '₱' + Number(n).toFixed(2);
}

function addItem(){

  const name = document.getElementById('itemName').value.trim();
  const price = parseFloat(document.getElementById('itemPrice').value);
  const qty = parseInt(document.getElementById('itemQty').textContent);

  if(!name || isNaN(price) || qty < 1){
    alert('Please complete all fields.');
    return;
  }

  currentSale.push({
    name,
    price,
    qty
  });

  document.getElementById('itemName').value = '';
  document.getElementById('itemPrice').value = '';
  document.getElementById('itemQty').textContent = 1;

  renderSale();
}

function renderSale(){

  const wrap = document.getElementById('saleList');

  document.getElementById('itemCount').textContent =
    currentSale.length + ' items';

  if(!currentSale.length){
    wrap.innerHTML = '<div class="empty">Add items for this transaction. (..◜ᴗ◝..)</div>';
    return;
  }

  wrap.innerHTML = currentSale.map(item => `
    <div class="sale-row">
      <div class="sale-info">
        <h3>${item.name}</h3>
        <p>${item.qty} × ${peso(item.price)}</p>
      </div>

      <div class="price">
        ${peso(item.price * item.qty)}
      </div>
    </div>
  `).join('');
}

function checkout(){

  if(!currentSale.length){
    alert('No items added yet.');
    return;
  }

  const total = currentSale.reduce((a,b)=>
    a + (b.price * b.qty),0);

  history.unshift({
    date:new Date().toLocaleString(),
    total,
    items:[...currentSale]
  });

  localStorage.setItem(
    'blue_ledger_history',
    JSON.stringify(history)
  );

  currentSale = [];

  renderSale();
  renderHistory();
}

// ADDED: Clear History function
function clearHistory(){
  if(!history.length){
    alert('Nothing to clear!');
    return;
  }
  if(!confirm('Clear all sales history? This cannot be undone.')){
    return;
  }
  history = [];
  localStorage.setItem('blue_ledger_history', JSON.stringify(history));
  renderHistory();
}

function renderHistory(){

  const wrap = document.getElementById('historyList');

  const revenue = history.reduce((a,b)=>a+b.total,0);

  const itemsSold = history.reduce((sum,txn)=>
    sum + txn.items.reduce((s,i)=>s+i.qty,0),0);

  document.getElementById('revenue').textContent =
    peso(revenue);

  document.getElementById('transactions').textContent =
    history.length;

  document.getElementById('itemsSold').textContent =
    itemsSold;

  if(!history.length){
    wrap.innerHTML =
      '<div class="empty">Your completed sales will appear here! ٩(^ᗜ^ )و ´-</div>';
    return;
  }

  wrap.innerHTML = history.map(txn => `
    <div class="history-item">

      <div class="history-top">
        <span>${txn.date}</span>
        <span class="history-total">${peso(txn.total)}</span>
      </div>

      ${txn.items.map(item => `
        <div style="display:flex;justify-content:space-between;margin-top:6px;color:#6f8297">
          <span>${item.name} × ${item.qty}</span>
          <span>${peso(item.price * item.qty)}</span>
        </div>
      `).join('')}

    </div>
  `).join('');
}

renderSale();
renderHistory();


// ADDED: Qty stepper function
function changeQty(delta){
  const el = document.getElementById('itemQty');
  const current = parseInt(el.textContent) || 1;
  const next = Math.max(1, current + delta);
  el.textContent = next;
}
</script>

</body>
</html>
